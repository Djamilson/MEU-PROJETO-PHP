<!-- Modal de Exclusão de Usuário -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="icon">⚠️</div>
      <h2 id="modalTitle">Excluir Usuário</h2>
    </div>
    <div class="modal-body" id="modalMessage">
      Tem certeza que deseja excluir este usuário? Esta ação não poderá ser desfeita.
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="cancelDeleteBtn">Cancelar</button>
      <button class="btn-danger" id="confirmDeleteBtn">Excluir</button>
    </div>
  </div>
</div>
